name: Genera snapshot pubblico

on:
  schedule:
    # Ogni 30 min, 07:00-22:30 UTC: finestra larga con margine per coprire
    # la fascia 11:00-22:30 ora locale di Roma sia in CET (UTC+1) sia in
    # CEST (UTC+2). Il cron gira solo in UTC e non è DST-aware, quindi
    # questa è solo una finestra "abbastanza larga" — la decisione precisa
    # su quando pubblicare davvero (fasce orarie, throttling) vive in
    # scripts/lib/finestraPubblicazione.mjs, non qui.
    - cron: '*/30 7-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-snapshot
  cancel-in-progress: true

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Scrivi credenziali Admin SDK temporanee
        run: echo "$FIREBASE_ADMIN_KEY" > "$RUNNER_TEMP/firebase-admin-key.json"
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_SNAPSHOT_ADMIN_KEY }}

      - name: Genera public-snapshot.json
        run: node scripts/generate-public-snapshot.mjs /tmp/public-snapshot.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-admin-key.json

      # Pubblica il JSON su un branch orfano dedicato ("public-data"), MAI su
      # main: così questo workflow non fa mai scattare deploy.yml (che si
      # attiva solo su push a main) e non serve mai un "npm run build".
      - name: Pubblica su branch public-data
        run: |
          if [ ! -f /tmp/public-snapshot.json ]; then
            echo "Fuori dalla finestra di pubblicazione per questo run, nulla da pubblicare."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin public-data || true
          if git show-ref --verify --quiet refs/remotes/origin/public-data; then
            git checkout -B public-data origin/public-data
          else
            git checkout --orphan public-data
            git rm -rf . > /dev/null
          fi

          cp /tmp/public-snapshot.json ./public-snapshot.json
          git add public-snapshot.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati, nulla da pubblicare."
          else
            git commit -m "Aggiorna snapshot pubblico"
            git push origin public-data
          fi
